<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>VIRUU AFTERDARK</title>

<style>

/* ================================
   RESET
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;

    background:#020203;
    color:white;

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}


/* ================================
   DARK BACKGROUND
================================ */

body{

    display:flex;

    justify-content:center;
    align-items:center;

    position:relative;

    background:

        radial-gradient(
            circle at center,
            #18181c 0%,
            #0a0a0c 35%,
            #030304 70%,
            #000 100%
        );
}


/* ================================
   MOVING FOG
================================ */

body::before{

    content:"";

    position:fixed;

    inset:-50%;

    background:

        radial-gradient(
            ellipse,
            rgba(255,255,255,.035),
            transparent 55%
        );

    animation:
        fog 12s ease-in-out infinite alternate;

    pointer-events:none;

    z-index:1;
}


/* ================================
   DARK GRAIN
================================ */

body::after{

    content:"";

    position:fixed;

    inset:0;

    background:

        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.015) 0px,
            rgba(255,255,255,.015) 1px,
            transparent 1px,
            transparent 4px
        );

    opacity:.35;

    pointer-events:none;

    z-index:3;
}


/* ================================
   PARTICLE CANVAS
================================ */

canvas{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    z-index:0;
}


/* ================================
   MAIN CONTENT
================================ */

.container{

    position:relative;

    z-index:5;

    text-align:center;

    color:white;

    animation:
        appear 2.5s ease;
}


/* ================================
   MAIN TITLE
================================ */

.title{

    font-family:

        "Times New Roman",
        Georgia,
        serif;

    font-size:

        clamp(
            38px,
            9vw,
            105px
        );

    font-weight:900;

    letter-spacing:

        clamp(
            6px,
            1.8vw,
            18px
        );

    text-transform:uppercase;

    color:#e9e9e9;

    text-shadow:

        0 0 5px
        rgba(255,255,255,.35),

        0 0 25px
        rgba(255,255,255,.12),

        0 0 70px
        rgba(255,255,255,.05);

    animation:

        titleAppear 3s ease,

        titleFlicker 6s infinite;
}


/* ================================
   CREATOR NAME
================================ */

.creator{

    margin-top:18px;

    font-family:

        "Courier New",
        monospace;

    font-size:

        clamp(
            9px,
            1.8vw,
            13px
        );

    letter-spacing:

        clamp(
            4px,
            1vw,
            8px
        );

    color:#777;

    text-transform:uppercase;

    animation:
        creatorFade 4s ease;
}


/* ================================
   SEPARATOR
================================ */

.line{

    width:140px;

    height:1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #555,
            transparent
        );

    margin:32px auto;
}


/* ================================
   ENTER BUTTON
================================ */

.enter{

    display:inline-block;

    padding:15px 30px;

    border:1px solid #333;

    color:#888;

    text-decoration:none;

    font-family:

        "Courier New",
        monospace;

    font-size:11px;

    letter-spacing:4px;

    transition:.5s ease;

    cursor:pointer;

    position:relative;
}


/* BUTTON OUTER GLOW */

.enter::before{

    content:"";

    position:absolute;

    inset:-8px;

    border:1px solid transparent;

    opacity:0;

    transition:.5s;
}


/* BUTTON HOVER */

.enter:hover{

    color:#eee;

    border-color:#777;

    box-shadow:

        0 0 20px
        rgba(255,255,255,.08),

        inset 0 0 20px
        rgba(255,255,255,.03);

    letter-spacing:6px;
}


.enter:hover::before{

    opacity:1;

    border-color:#222;
}


/* ================================
   PAGE APPEAR
================================ */

@keyframes appear{

    from{

        opacity:0;

        transform:
            translateY(30px)
            scale(.96);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* ================================
   TITLE APPEAR
================================ */

@keyframes titleAppear{

    0%{

        opacity:0;

        letter-spacing:35px;

        filter:blur(12px);
    }

    100%{

        opacity:1;

        letter-spacing:
            clamp(
                6px,
                1.8vw,
                18px
            );

        filter:blur(0);
    }
}


/* ================================
   TITLE FLICKER
================================ */

@keyframes titleFlicker{

    0%,
    94%,
    100%{

        opacity:1;
    }

    95%{

        opacity:.75;
    }

    96%{

        opacity:1;
    }

    97%{

        opacity:.85;
    }
}


/* ================================
   CREATOR FADE
================================ */

@keyframes creatorFade{

    from{

        opacity:0;

        letter-spacing:15px;
    }

    to{

        opacity:1;

        letter-spacing:
            clamp(
                4px,
                1vw,
                8px
            );
    }
}


/* ================================
   FOG ANIMATION
================================ */

@keyframes fog{

    0%{

        transform:

            translate(-5%,-3%)
            scale(1);
    }

    100%{

        transform:

            translate(5%,4%)
            scale(1.15);
    }
}

</style>

</head>


<body>


<!-- ================================
     PARTICLES
================================ -->

<canvas id="particles"></canvas>


<!-- ================================
     MAIN CONTENT
================================ -->

<div class="container">

    <div class="title">

        VIRUU AFTERDARK

    </div>


    <div class="creator">

        VISHAL N. TELAM

    </div>


    <div class="line"></div>


    <a
        class="enter"
        onclick="enterWorld()"
    >

        ENTER THE UNKNOWN →

    </a>

</div>



<script>

/* ================================
   CANVAS SETUP
================================ */

const canvas =
    document.getElementById("particles");

const ctx =
    canvas.getContext("2d");


let particles = [];


/* ================================
   RESIZE
================================ */

function resize(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resize();


window.addEventListener(
    "resize",
    resize
);


/* ================================
   CREATE PARTICLES
================================ */

for(
    let i = 0;
    i < 150;
    i++
){

    particles.push({

        x:
            Math.random()
            * window.innerWidth,

        y:
            Math.random()
            * window.innerHeight,

        size:
            Math.random()
            * 1.8,

        speed:
            Math.random()
            * .45
            + .08,

        opacity:
            Math.random()
            * .5
            + .1
    });
}


/* ================================
   ANIMATE PARTICLES
================================ */

function animate(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    particles.forEach(
        p => {

            p.y -= p.speed;


            if(
                p.y < 0
            ){

                p.y =
                    canvas.height;

                p.x =
                    Math.random()
                    * canvas.width;
            }


            ctx.beginPath();


            ctx.arc(

                p.x,
                p.y,
                p.size,
                0,
                Math.PI * 2

            );


            ctx.fillStyle =
                `rgba(
                    255,
                    255,
                    255,
                    ${p.opacity}
                )`;


            ctx.fill();

        }
    );


    requestAnimationFrame(
        animate
    );
}


animate();


/* ================================
   ENTER UNKNOWN
================================ */

function enterWorld(){

    const container =
        document.querySelector(
            ".container"
        );


    container.style.transition =
        "1s ease";


    container.style.transform =
        "scale(1.25)";


    container.style.opacity =
        "0";


    setTimeout(

        () => {

            alert(
                "THE UNKNOWN AWAITS... 🌑"
            );

        },

        900
    );
}

</script>


</body>

</html>
