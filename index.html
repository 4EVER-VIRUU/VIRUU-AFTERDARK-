<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIRUU AFTERDARK</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial, sans-serif;
}

/* BACKGROUND */

body{
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* PARTICLES */

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
}

/* MAIN */

.container{
    position:relative;
    z-index:2;
    text-align:center;
    color:white;
    animation:appear 2s ease;
}

.title{
    font-size:clamp(42px,10vw,100px);
    font-weight:900;
    letter-spacing:12px;
    text-transform:uppercase;

    text-shadow:
        0 0 20px rgba(255,255,255,.15),
        0 0 60px rgba(255,255,255,.05);

    animation:titleGlow 4s ease-in-out infinite;
}

.creator{
    margin-top:14px;
    font-size:clamp(10px,2vw,15px);
    letter-spacing:7px;
    color:#777;
    text-transform:uppercase;
}

.line{
    width:120px;
    height:1px;
    background:#333;
    margin:30px auto;
}

.enter{
    display:inline-block;
    padding:15px 30px;
    border:1px solid #333;
    color:#aaa;
    text-decoration:none;
    font-size:12px;
    letter-spacing:4px;
    transition:.4s;
    cursor:pointer;
}

.enter:hover{
    color:#fff;
    border-color:#fff;
    box-shadow:0 0 30px rgba(255,255,255,.15);
    transform:scale(1.05);
}

/* ANIMATIONS */

@keyframes appear{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes titleGlow{

    0%,100%{
        opacity:.85;
    }

    50%{
        opacity:1;
        text-shadow:
        0 0 30px rgba(255,255,255,.25),
        0 0 80px rgba(255,255,255,.08);
    }

}

</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="container">

    <div class="title">
        VIRUU AFTERDARK
    </div>

    <div class="creator">
        VISHAL N. TELAM
    </div>

    <div class="line"></div>

    <a class="enter" onclick="enterWorld()">
        ENTER THE UNKNOWN →
    </a>

</div>

<script>

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let particles = [];

function resize(){

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

resize();

window.addEventListener("resize",resize);

for(let i=0;i<120;i++){

    particles.push({

        x:Math.random()*window.innerWidth,

        y:Math.random()*window.innerHeight,

        size:Math.random()*2,

        speed:Math.random()*.4+.1

    });

}

function animate(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    particles.forEach(p=>{

        p.y -= p.speed;

        if(p.y < 0){

            p.y = canvas.height;

            p.x = Math.random()*canvas.width;

        }

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fillStyle="rgba(255,255,255,.35)";

        ctx.fill();

    });

    requestAnimationFrame(animate);

}

animate();


function enterWorld(){

    document.querySelector(".container").style.transform="scale(1.2)";
    document.querySelector(".container").style.opacity="0";

    setTimeout(()=>{

        alert("THE UNKNOWN AWAITS... 🌑");

    },800);

}

</script>

</body>
</html>
